name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  # Node.js 24's own Linux binaries need glibc 2.28, so the add-on targets the same floor.
  GLIBC: '2.28'
jobs:
  qualify:
    outputs:
      signed_run: ${{ steps.evidence.outputs.signed_run }}
    name: Release qualification evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require evidence for tag publication
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then stage=beta
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stage=stable
          else echo "Unsupported release tag" >&2; exit 1; fi
          node scripts/check-release.mjs "$stage" "$RELEASE_TAG"
      - id: evidence
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const e=require("./docs/release-evidence.json"); console.log("signed_run="+e.checks.signed_distribution.run_id)' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.evidence.outputs.signed_run }}
          pattern: signed-*-${{ github.ref_name }}
          path: signed-candidates
      - name: Verify signed candidate checksums and source before any publication
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          node scripts/verify-candidates.mjs signed-candidates dist
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: validated-signed-apps
          path: dist/

  linux:
    name: Linux tarballs, .deb and .rpm
    needs: qualify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0~dev.$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Web server bundle (the same for every architecture)
        working-directory: web
        env:
          TEMPERANCE_VERSION: ${{ steps.version.outputs.version }}
        run: npm ci && npm run build
      - name: Gateway add-ons against glibc ${{ env.GLIBC }}
        working-directory: core
        run: |
          for t in x86_64 aarch64; do
            cargo zigbuild --release -p temperance-gateway --features node --lib --target "$t-unknown-linux-gnu.$GLIBC"
            so=target/$t-unknown-linux-gnu/release/libtemperance_gateway.so
            newest=$(readelf --dyn-syms -W "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$t needs $newest"
            [ "$(printf '%s\n' "${newest#GLIBC_}" "$GLIBC" | sort -V | tail -1)" = "$GLIBC" ] || { echo "$so needs $newest" >&2; exit 1; }
          done
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deploy/linux/package.sh x64 "$VERSION" core/target/x86_64-unknown-linux-gnu/release/libtemperance_gateway.so
          deploy/linux/package.sh arm64 "$VERSION" core/target/aarch64-unknown-linux-gnu/release/libtemperance_gateway.so
      - name: Runs on old distributions (glibc 2.28)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in debian:10-slim rockylinux:8-minimal; do
            docker run --rm -v "$PWD/dist/temperance-$VERSION-linux-x64:/opt/temperance:ro" \
              -e TEMPERANCE_DATA_DIR=/tmp/t -e TEMPERANCE_ADMIN_PASSWORD=release-smoke-test \
              -e "TEMPERANCE_GATEWAY_TOKEN=$(openssl rand -hex 24)" -e TEMPERANCE_PUBLIC_URL=http://127.0.0.1:3000 \
              -e TEMPERANCE_VPN_ENDPOINT=vpn.example.net:51820 -e TEMPERANCE_TIMEZONE=UTC \
              -e TEMPERANCE_GATEWAY_LISTEN=127.0.0.1:51820 -e HOSTNAME=127.0.0.1 -e PORT=3000 "$image" \
              sh -c 'cd /opt/temperance/app && /opt/temperance/node/bin/node scripts/acceptance.mjs server.js'
            echo "OK on $image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  image:
    name: Container image (amd64, arm64)
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Unpack tarballs for the image
        run: |
          for pair in x64:amd64 arm64:arm64; do
            mkdir -p dist/image/${pair#*:}
            tar -xzf dist/temperance-*-linux-${pair%%:*}.tar.gz -C dist/image/${pair#*:} --strip-components=1
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub publishing credential
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure the DOCKERHUB_TOKEN repository secret with write access to mistertea/temperance before publishing.'
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'mistertea' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            mistertea/temperance
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta.') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qualify, linux, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: validated-signed-apps
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
