name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  # Node.js 24's own Linux binaries need glibc 2.28, so the add-on targets the same floor.
  GLIBC: '2.28'
jobs:
  linux:
    name: Linux tarballs, .deb and .rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0~dev.$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Web server bundle (the same for every architecture)
        working-directory: web
        run: npm ci && npm run build
      - name: Gateway add-ons against glibc ${{ env.GLIBC }}
        working-directory: core
        run: |
          for t in x86_64 aarch64; do
            cargo zigbuild --release -p temperance-gateway --features node --lib --target "$t-unknown-linux-gnu.$GLIBC"
            so=target/$t-unknown-linux-gnu/release/libtemperance_gateway.so
            newest=$(readelf --dyn-syms -W "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$t needs $newest"
            [ "$(printf '%s\n' "${newest#GLIBC_}" "$GLIBC" | sort -V | tail -1)" = "$GLIBC" ] || { echo "$so needs $newest" >&2; exit 1; }
          done
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deploy/linux/package.sh x64 "$VERSION" core/target/x86_64-unknown-linux-gnu/release/libtemperance_gateway.so
          deploy/linux/package.sh arm64 "$VERSION" core/target/aarch64-unknown-linux-gnu/release/libtemperance_gateway.so
      - name: Runs on old distributions (glibc 2.28)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in debian:10-slim rockylinux:8-minimal; do
            docker run --rm -v "$PWD/dist/temperance-$VERSION-linux-x64:/opt/temperance:ro" \
              -e TEMPERANCE_DATA_DIR=/tmp/t -e TEMPERANCE_ADMIN_PASSWORD=release-smoke-test \
              -e "TEMPERANCE_GATEWAY_TOKEN=$(openssl rand -hex 24)" -e TEMPERANCE_PUBLIC_URL=http://127.0.0.1:3000 \
              -e TEMPERANCE_VPN_ENDPOINT=vpn.example.net:51820 -e TEMPERANCE_TIMEZONE=UTC \
              -e TEMPERANCE_GATEWAY_LISTEN=127.0.0.1:51820 -e HOSTNAME=127.0.0.1 -e PORT=3000 "$image" \
              sh -c 'cd /opt/temperance/app && (/opt/temperance/node/bin/node server.js > /tmp/log 2>&1 &) && sleep 5 && cat /tmp/log &&
                grep -q "Temperance gateway on udp" /tmp/log &&
                /opt/temperance/node/bin/node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r => process.exit(r.ok ? 0 : 1))"'
            echo "OK on $image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  image:
    name: Container image (amd64, arm64)
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Unpack tarballs for the image
        run: |
          for pair in x64:amd64 arm64:arm64; do
            mkdir -p dist/image/${pair#*:}
            tar -xzf dist/temperance-*-linux-${pair%%:*}.tar.gz -C dist/image/${pair#*:} --strip-components=1
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
