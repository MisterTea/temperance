name: Release
# Push a vX.Y.Z or vX.Y.Z-beta.N tag. Stable tags need passing release evidence
# and signed candidate apps. A beta tag without them becomes an unqualified
# preview: clients are built here without signing and the release says so.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Node.js 24's own Linux binaries need glibc 2.28, so the add-on targets the same floor.
  GLIBC: '2.28'
jobs:
  qualify:
    outputs:
      version: ${{ steps.version.outputs.version }}
      qualified: ${{ steps.evidence.outputs.qualified }}
      desktop: ${{ steps.evidence.outputs.desktop }}
    name: Release qualification evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then v="0.0.0-dev.$GITHUB_RUN_NUMBER"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then v="${RELEASE_TAG#v}"
          else echo "::error::Use a vX.Y.Z or vX.Y.Z-beta.N tag" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check evidence for this exact source
        id: evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          qualified=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            stage=$([[ "$RELEASE_TAG" == *-beta.* ]] && echo beta || echo stable)
            if node scripts/check-release.mjs "$stage" "$RELEASE_TAG"; then qualified=true
            elif [ "$stage" = stable ]; then exit 1
            else echo "::warning::$RELEASE_TAG has no release evidence; publishing an unqualified preview with unsigned clients."; fi
          fi
          echo "qualified=$qualified" >> "$GITHUB_OUTPUT"
          # Signed candidates already include the Windows installer.
          windows='{"os":"windows-latest","name":"windows-x64","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"windows-latest","name":"windows-arm64","target":"aarch64-pc-windows-msvc","bundles":"nsis"},'
          linux='{"os":"ubuntu-22.04","name":"linux-x64","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}'
          if [ "$qualified" = true ]; then windows=''; fi
          echo "desktop={\"include\":[$windows$linux]}" >> "$GITHUB_OUTPUT"
      - id: signed
        if: steps.evidence.outputs.qualified == 'true'
        run: node -e 'const e=require("./docs/release-evidence.json"); console.log("run="+e.checks.signed_distribution.run_id)' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.evidence.outputs.qualified == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.signed.outputs.run }}
          pattern: signed-*-${{ github.ref_name }}
          path: signed-candidates
      - name: Verify signed candidate checksums and source before any publication
        if: steps.evidence.outputs.qualified == 'true'
        run: |
          mkdir -p dist
          node scripts/verify-candidates.mjs signed-candidates dist
      - uses: actions/upload-artifact@v4
        if: steps.evidence.outputs.qualified == 'true'
        with:
          name: client-signed
          path: dist/

  linux:
    name: Linux tarballs, .deb and .rpm
    needs: qualify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Web server bundle (the same for every architecture)
        working-directory: web
        env:
          TEMPERANCE_VERSION: ${{ needs.qualify.outputs.version }}
        run: npm ci && npm run build
      - name: Gateway add-ons against glibc ${{ env.GLIBC }}
        working-directory: core
        run: |
          for t in x86_64 aarch64; do
            cargo zigbuild --release -p temperance-gateway --features node --lib --target "$t-unknown-linux-gnu.$GLIBC"
            so=target/$t-unknown-linux-gnu/release/libtemperance_gateway.so
            newest=$(readelf --dyn-syms -W "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$t needs $newest"
            [ "$(printf '%s\n' "${newest#GLIBC_}" "$GLIBC" | sort -V | tail -1)" = "$GLIBC" ] || { echo "$so needs $newest" >&2; exit 1; }
          done
      - name: Package
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          deploy/linux/package.sh x64 "$VERSION" core/target/x86_64-unknown-linux-gnu/release/libtemperance_gateway.so
          deploy/linux/package.sh arm64 "$VERSION" core/target/aarch64-unknown-linux-gnu/release/libtemperance_gateway.so
      - name: Runs on old distributions (glibc 2.28)
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          for image in debian:10-slim rockylinux:8-minimal; do
            docker run --rm -v "$PWD/dist/temperance-$VERSION-linux-x64:/opt/temperance:ro" \
              -e TEMPERANCE_DATA_DIR=/tmp/t -e TEMPERANCE_ADMIN_PASSWORD=release-smoke-test \
              -e "TEMPERANCE_GATEWAY_TOKEN=$(openssl rand -hex 24)" -e TEMPERANCE_PUBLIC_URL=http://127.0.0.1:3000 \
              -e TEMPERANCE_VPN_ENDPOINT=vpn.example.net:51820 -e TEMPERANCE_TIMEZONE=UTC \
              -e TEMPERANCE_GATEWAY_LISTEN=127.0.0.1:51820 -e HOSTNAME=127.0.0.1 -e PORT=3000 "$image" \
              sh -c 'cd /opt/temperance/app && /opt/temperance/node/bin/node scripts/acceptance.mjs server.js'
            echo "OK on $image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  android:
    name: Android APK (unsigned preview)
    needs: qualify
    if: needs.qualify.outputs.qualified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: cargo install cargo-ndk --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Debug-signed APK with the release version
        env:
          TEMPERANCE_VERSION: ${{ needs.qualify.outputs.version }}
          # Above the 0.5.6 store build (7) so previews install over each other.
          TEMPERANCE_BUILD_NUMBER: ${{ github.run_number }}00
        run: |
          clients/android/gradlew -p clients/android assembleDebug
          mkdir -p dist
          cp clients/android/app/build/outputs/apk/debug/app-debug.apk "dist/temperance-$TEMPERANCE_VERSION-android-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: dist/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: qualify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualify.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: desktop-${{ matrix.target }}
      - if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - working-directory: clients/desktop
        run: npm ci && npm run build
      - name: Installer
        working-directory: core/temperance-desktop
        shell: bash
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: ../../clients/desktop/node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"
      - name: Name the installers after the release
        shell: bash
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          bundle=core/target/${{ matrix.target }}/release/bundle
          prefix=dist/temperance-desktop-$VERSION-${{ matrix.name }}
          mkdir -p dist
          for f in "$bundle"/nsis/*.exe; do [ -e "$f" ] && cp "$f" "$prefix-setup.exe"; done
          for f in "$bundle"/deb/*.deb; do [ -e "$f" ] && cp "$f" "$prefix.deb"; done
          for f in "$bundle"/appimage/*.AppImage; do [ -e "$f" ] && cp "$f" "$prefix.AppImage"; done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [qualify, linux, android, desktop]
    # Qualified releases skip the Android preview: they ship the signed apps instead.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.linux.result == 'success' && needs.desktop.result == 'success' && (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.qualify.outputs.qualified == 'true')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Preview notice
        if: needs.qualify.outputs.qualified != 'true'
        run: |
          cat > notes.md <<'EOF'
          **Unqualified preview.** This beta has not passed release qualification, and its clients are unsigned test builds: the Android APK is debug-signed, the Windows installers have no Authenticode signature, and there are no Apple builds (iOS and macOS VPN apps need Apple signing). Use it to try the server and desktop app, not to protect a household.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ needs.qualify.outputs.qualified != 'true' && 'notes.md' || '' }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: Container image (amd64, arm64)
    needs: [qualify, linux, publish]
    # Pushed only after the GitHub release exists; manual runs build without pushing.
    if: ${{ !cancelled() && needs.linux.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Unpack tarballs for the image
        run: |
          for pair in x64:amd64 arm64:arm64; do
            mkdir -p dist/image/${pair#*:}
            tar -xzf dist/temperance-*-linux-${pair%%:*}.tar.gz -C dist/image/${pair#*:} --strip-components=1
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub publishing credential
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure the DOCKERHUB_TOKEN repository secret with write access to mistertea/temperance before publishing.'
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'mistertea' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            mistertea/temperance
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta.') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
