name: Mobile and Apple clients and VPN integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  android:
    name: Android APK (Rust core via cargo-ndk + UniFFI Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: cargo install cargo-ndk --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Unit tests (Robolectric) with an 80% line gate, APK and instrumentation APK
        run: clients/android/gradlew -p clients/android testDebugUnitTest unitTestCoverageCheck assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: clients/android/app/build/reports/jacoco/unitTestCoverage/
      - name: APK bundles the core for every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l clients/android/app/build/outputs/apk/debug/app-debug.apk | grep "lib/$abi/libtemperance_core.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    name: Android instrumented and real-server tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-emulator
      - run: cargo install cargo-ndk --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Policy service with the embedded gateway, for the real-server test
        working-directory: web
        run: npm ci && npm run build:gateway && npm run build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup flow, menus and layout audits, then the app against the real server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            clients/android/gradlew -p clients/android connectedDebugAndroidTest
            TEMPERANCE_DISPOSABLE_TEST=1 clients/android/e2e/real-server.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-emulator-reports
          path: |
            clients/android/app/build/reports/androidTests
            clients/android/app/build/outputs/androidTest-results
            clients/android/app/build/e2e/server.log
          retention-days: 14

  apple:
    name: macOS and iOS apps (Rust core XCFramework + UniFFI Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - run: brew install xcodegen
      - run: clients/apple/bootstrap.sh
      - run: xcodebuild -project clients/apple/Temperance.xcodeproj -scheme TemperanceMac -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests with an 80% line gate on the app sources
        run: |
          xcodebuild -project clients/apple/Temperance.xcodeproj -scheme TemperanceMac -derivedDataPath build/apple \
            -resultBundlePath build/apple-tests.xcresult -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO test
          clients/apple/coverage.py build/apple-tests.xcresult 80
      - run: xcodebuild -project clients/apple/Temperance.xcodeproj -scheme TemperanceIOS -destination 'generic/platform=iOS' -derivedDataPath build/apple-ios CODE_SIGNING_ALLOWED=NO build

  vpn-integration:
    name: Gateway router mode (nftables, privileged container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.test -t temperance-test .
      - run: docker run --rm --privileged temperance-test
