name: Mobile and Apple clients and VPN integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    name: Android APK (Rust core via cargo-ndk + UniFFI Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: cargo install cargo-ndk --locked
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: clients/android/gradlew -p clients/android assembleDebug
      - name: APK bundles the core for every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l clients/android/app/build/outputs/apk/debug/app-debug.apk | grep "lib/$abi/libtemperance_core.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk

  apple:
    name: macOS and iOS apps (Rust core XCFramework + UniFFI Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - run: brew install xcodegen
      - run: clients/apple/bootstrap.sh
      - run: xcodebuild -project clients/apple/Temperance.xcodeproj -scheme TemperanceMac -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project clients/apple/Temperance.xcodeproj -scheme TemperanceIOS -destination 'generic/platform=iOS' -derivedDataPath build/apple-ios CODE_SIGNING_ALLOWED=NO build

  vpn-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.test -t temperance-test .
      - run: docker run --rm --privileged -v "$PWD:/workspace:ro" temperance-test
