name: System tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: Test a published server image instead of building from source
        required: false
permissions:
  contents: read
jobs:
  system:
    name: Client and server in an isolated Docker network
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load the WireGuard kernel module
        run: sudo modprobe wireguard
      - name: Run the system tests
        run: sh systest/run.sh
        env:
          TEMPERANCE_SYSTEST_SERVER_IMAGE: ${{ inputs.image }}
