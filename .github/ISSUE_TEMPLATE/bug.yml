name: Beta bug
description: Report a reproducible problem without household data or credentials.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use SECURITY.md. Do not attach browsing history, configuration exports, recovery archives, .env files, IP addresses, or location data."
  - type: input
    id: versions
    attributes:
      label: Server version, app version, OS and installation method
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic client names and domains.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Impact and recovery
      description: Did protection fail, did internet access stop, or was any data lost? What restored service?
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed support report
      description: Optionally attach the redacted report from Settings after reviewing it.
