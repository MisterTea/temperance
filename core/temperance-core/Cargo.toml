[package]
name = "temperance-core"
description = "Shared Temperance client logic: policy engine, enrollment, tunnel config, child status"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "temperance_core"

[dependencies]
uniffi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
url = "2"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", optional = true, default-features = false, features = ["ring"] }
ring = "0.17"
httparse = { version = "1", optional = true }

[features]
# Parent mode: QUIC to the home gateway over its WireGuard port, plus a loopback
# proxy for the dashboard. The gateway uses the same protocol code.
remote = ["dep:tokio", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:httparse"]

[dev-dependencies]
pretty_assertions = "1"
