[package]
name = "temperance-desktop"
description = "Temperance VPN client for Linux, Windows, and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "temperance"
path = "src/main.rs"

[dependencies]
temperance-core = { path = "../temperance-core" }
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
