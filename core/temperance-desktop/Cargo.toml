[package]
name = "temperance-desktop"
description = "Temperance for Windows (child and parent mode) and Linux (parent mode), built with Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "temperance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
temperance-core = { path = "../temperance-core", features = ["remote"] }
tauri = { version = "2", features = [] }
serde.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
serde_json.workspace = true
base64 = "0.22"
url = "2"
tiny_http = "0.12"
