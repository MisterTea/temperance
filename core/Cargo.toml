[workspace]
resolver = "2"
members = ["temperance-core", "temperance-desktop", "uniffi-bindgen"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
