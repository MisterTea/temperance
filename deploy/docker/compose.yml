# Temperance in Docker. Settings live in .env next to this file (see .env.example,
# or let install.sh write it). Upgrade from the dashboard (Settings → Software updates)
# with the updater below, or with `docker compose pull && docker compose up -d`.
name: temperance
services:
  temperance:
    image: ${TEMPERANCE_IMAGE:-ghcr.io/mistertea/temperance:latest}
    restart: unless-stopped
    env_file: .env
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TEMPERANCE_DATA_DIR: /data
      TEMPERANCE_GATEWAY_LISTEN: 0.0.0.0:51820
    ports:
      # Plain HTTP: keep it on 127.0.0.1 and reach it through Caddy or Cloudflare below.
      - ${TEMPERANCE_DASHBOARD_PORT:-127.0.0.1:8788}:3000
      # WireGuard, the port your router forwards. UDP only.
      - ${TEMPERANCE_WIREGUARD_PORT:-51820}:51820/udp
    volumes: [temperance-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      start_period: 20s

  # COMPOSE_PROFILES=caddy: Let's Encrypt HTTPS for TEMPERANCE_PUBLIC_URL; forward TCP 80 and 443 too.
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${TEMPERANCE_PUBLIC_URL:-https://localhost} --to temperance:3000
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [temperance]

  # COMPOSE_PROFILES=cloudflared: no inbound TCP ports. In the Cloudflare dashboard, route
  # the tunnel's public hostname to http://temperance:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflared]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [temperance]

  # COMPOSE_PROFILES=updater: Watchtower pulls a new Temperance image and recreates the
  # container when the dashboard asks (TEMPERANCE_UPDATER_TOKEN must be set), and also
  # nightly when TEMPERANCE_AUTO_UPDATE=true. It needs the Docker socket, so it is a
  # separate container; Temperance itself never gets it. Its API is not published.
  updater:
    image: nickfedor/watchtower:latest
    profiles: [updater]
    restart: unless-stopped
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${TEMPERANCE_UPDATER_TOKEN:-}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${TEMPERANCE_AUTO_UPDATE:-false}
      WATCHTOWER_SCHEDULE: ${TEMPERANCE_AUTO_UPDATE_SCHEDULE:-0 0 3 * * *}
      TZ: ${TEMPERANCE_TIMEZONE:-UTC}
    security_opt: [no-new-privileges:true]

volumes:
  temperance-data:
  caddy-data:
