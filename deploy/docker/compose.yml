# Temperance in Docker. Settings live in .env next to this file (see .env.example,
# or let install.sh write it). Upgrade with `docker compose pull && docker compose up -d`.
name: temperance
services:
  temperance:
    image: ${TEMPERANCE_IMAGE:-ghcr.io/mistertea/temperance:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TEMPERANCE_DATA_DIR: /data
      TEMPERANCE_GATEWAY_LISTEN: 0.0.0.0:51820
    ports:
      # Plain HTTP: keep it on 127.0.0.1 and reach it through Caddy or Cloudflare below.
      - ${TEMPERANCE_DASHBOARD_PORT:-127.0.0.1:8788}:3000
      # WireGuard, the port your router forwards. UDP only.
      - ${TEMPERANCE_WIREGUARD_PORT:-51820}:51820/udp
    volumes: [temperance-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      start_period: 20s

  # COMPOSE_PROFILES=caddy: Let's Encrypt HTTPS for TEMPERANCE_PUBLIC_URL; forward TCP 80 and 443 too.
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${TEMPERANCE_PUBLIC_URL:-https://localhost} --to temperance:3000
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [temperance]

  # COMPOSE_PROFILES=cloudflared: no inbound TCP ports. In the Cloudflare dashboard, route
  # the tunnel's public hostname to http://temperance:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflared]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [temperance]

volumes:
  temperance-data:
  caddy-data:
