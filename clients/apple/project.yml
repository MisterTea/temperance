name: Temperance
options:
  bundleIdPrefix: org.temperance
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Generated Info.plists take their versions from these; iOS won't install a bundle without them.
    MARKETING_VERSION: 0.5.0
    CURRENT_PROJECT_VERSION: 1
packages:
  WireGuardKit:
    path: Vendor/wireguard-apple
targetTemplates:
  BaseApp:
    sources: [App, Core/Sources]
    dependencies:
      - package: WireGuardKit
      - framework: Core/TemperanceCoreFFI.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Temperance
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your parents can ask where this device is. Temperance shares one location only when they ask, and tells you when it does.
        INFOPLIST_KEY_NSLocationUsageDescription: Your parents can ask where this device is. Temperance shares one location only when they ask, and tells you when it does.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code on your family dashboard to open it from anywhere.
        INFOPLIST_KEY_KeychainAccessGroup: $(AppIdentifierPrefix)org.temperance.shared
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    preBuildScripts:
      - name: Build WireGuard Go bridge
        script: '"$SRCROOT/build-bridge.sh"'
        basedOnDependencyAnalysis: false
  BaseTunnel:
    sources:
      - path: Tunnel
      - path: App/Identity.swift
      - path: Core/Sources
    dependencies:
      - package: WireGuardKit
      - framework: Core/TemperanceCoreFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_KeychainAccessGroup: $(AppIdentifierPrefix)org.temperance.shared
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
    info:
      path: Tunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    preBuildScripts:
      - name: Build WireGuard Go bridge
        script: '"$SRCROOT/build-bridge.sh"'
        basedOnDependencyAnalysis: false
targets:
  TemperanceMac:
    templates: [BaseApp]
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.mac
        INFOPLIST_KEY_TunnelBundleIdentifier: org.temperance.mac.tunnel
    dependencies:
      - target: TemperanceMacTunnel
        embed: true
  TemperanceMacTunnel:
    templates: [BaseTunnel]
    type: app-extension
    platform: macOS
    deploymentTarget: '13.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.mac.tunnel
  TemperanceIOS:
    templates: [BaseApp]
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.ios
        INFOPLIST_KEY_TunnelBundleIdentifier: org.temperance.ios.tunnel
        # Without a launch screen iOS letterboxes the app at an old iPhone size.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - target: TemperanceIOSTunnel
        embed: true
  TemperanceIOSTunnel:
    templates: [BaseTunnel]
    type: app-extension
    platform: iOS
    deploymentTarget: '16.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.ios.tunnel
  # The app's sources compiled straight into an unhosted test bundle (no signing or entitlements).
  TemperanceMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - Tests
      - path: App
        excludes: [TemperanceApp.swift]
      - Core/Sources
    dependencies:
      - package: WireGuardKit
      - framework: Core/TemperanceCoreFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.mac.tests
    preBuildScripts:
      - name: Build WireGuard Go bridge
        script: '"$SRCROOT/build-bridge.sh"'
        basedOnDependencyAnalysis: false
  # Remote control for recording the client storyboards (clients/storyboards).
  TemperanceIOSStoryboard:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '16.0'
    sources: [Storyboard]
    dependencies:
      - target: TemperanceIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.temperance.ios.storyboard
        TEST_TARGET_NAME: TemperanceIOS
schemes:
  TemperanceIOSStoryboard:
    build:
      targets:
        TemperanceIOS: all
        TemperanceIOSStoryboard: [test]
    test:
      targets: [TemperanceIOSStoryboard]
  TemperanceMac:
    build:
      targets:
        TemperanceMac: all
    test:
      targets: [TemperanceMacTests]
      gatherCoverageData: true
      coverageTargets: [TemperanceMacTests]
  TemperanceIOS:
    build:
      targets:
        TemperanceIOS: all
