[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temperance-gateway"
version = "0.2.0"
description = "Linux WireGuard and DNS enforcement gateway for the Temperance web service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Temperance contributors"}]
dependencies = []

[project.scripts]
temperance-gateway = "temperance.gateway:main"

[tool.setuptools.packages.find]
include = ["temperance*"]

[tool.coverage.run]
source = ["temperance"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
