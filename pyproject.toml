[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temperance-gateway"
version = "0.2.0"
description = "Local-first, open source family DNS controls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Temperance contributors"}]
dependencies = []

[project.scripts]
temperance = "temperance.server:main"
temperance-control = "temperance.control:main"
temperance-gateway = "temperance.gateway:main"

[tool.setuptools.packages.find]
include = ["temperance*"]

[tool.setuptools.package-data]
temperance = ["static/*"]
